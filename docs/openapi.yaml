openapi: 3.0.3
info:
  title: AttendWise AI API
  description: |
    AttendWise AI detects workforce attendance anomalies, investigates them using contextual schedules and company policies, recommends evidence-backed resolutions, obtains human approval, and atomically executes authorized adjustments with complete audit trails.
  version: 1.0.0
servers:
  - url: http://localhost:3001/api/v1
    description: Local Core API Server
  - url: http://localhost:8000
    description: Local AI & RAG Service Server

paths:
  /auth/login:
    post:
      summary: User Authentication
      description: Authenticate user using email and password, returning a signed JWT token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: hr.admin@acme.com
                password:
                  type: string
                  example: demo1234
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          description: Invalid credentials

  /auth/me:
    get:
      summary: Current Authenticated User Context
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User context retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'

  /employees:
    get:
      summary: List Employees
      security:
        - BearerAuth: []
      parameters:
        - name: department
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: List of employees
          content:
            application/json:
              schema:
                type: object
                properties:
                  employees:
                    type: array
                    items:
                      $ref: '#/components/schemas/Employee'

  /attendance:
    get:
      summary: Query Attendance Records
      security:
        - BearerAuth: []
      parameters:
        - name: employeeId
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [RECORDED, FLAGGED, RESOLVED]
        - name: startDate
          in: query
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Attendance records retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  records:
                    type: array
                    items:
                      $ref: '#/components/schemas/AttendanceRecord'
                  total:
                    type: integer

  /attendance/scan:
    post:
      summary: Deterministic Attendance Anomaly Scan
      description: Evaluates punch logs against scheduled shifts and thresholds (grace period, missing punches, overtime), detecting anomalies and triggering investigations.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [startDate, endDate]
              properties:
                startDate:
                  type: string
                  format: date
                  example: '2026-11-01'
                endDate:
                  type: string
                  format: date
                  example: '2026-11-19'
                departmentId:
                  type: string
      responses:
        '200':
          description: Scan completed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  exceptions:
                    type: integer

  /exceptions:
    get:
      summary: List Attendance Exceptions
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [DETECTED, INVESTIGATING, WAITING_FOR_APPROVAL, RESOLVED, REJECTED, CANCELLED]
        - name: type
          in: query
          schema:
            type: string
            enum: [MISSING_CLOCK_OUT, MISSING_CLOCK_IN, LATE_ARRIVAL, EARLY_DEPARTURE, OVERTIME_REVIEW]
        - name: severity
          in: query
          schema:
            type: string
            enum: [LOW, MEDIUM, HIGH]
      responses:
        '200':
          description: Filtered exception cases
          content:
            application/json:
              schema:
                type: object
                properties:
                  exceptions:
                    type: array
                    items:
                      $ref: '#/components/schemas/ExceptionCase'

  /exceptions/{id}:
    get:
      summary: Exception Case Detail
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Exception case details with investigation, recommendation, and audit history
          content:
            application/json:
              schema:
                type: object
                properties:
                  exception:
                    $ref: '#/components/schemas/ExceptionCase'
                  investigation:
                    $ref: '#/components/schemas/Investigation'
                  recommendation:
                    $ref: '#/components/schemas/Recommendation'
                  approval:
                    $ref: '#/components/schemas/Approval'

  /exceptions/{id}/investigate:
    post:
      summary: Trigger AI Investigation Pipeline
      description: Executes the LangGraph / semantic investigation runner on the exception, synthesizing evidence, querying policy chunks, generating recommendations, and publishing an approval item.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Investigation completed and approval created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  investigationId:
                    type: string
                  recommendationId:
                    type: string
                  approvalId:
                    type: string
                  verdict:
                    type: string
                  proposedAction:
                    type: string

  /approvals:
    get:
      summary: Pending Approval Inbox
      description: Returns pending human-in-the-loop approvals assigned to the current manager or organization (HR_ADMIN).
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            default: PENDING
      responses:
        '200':
          description: List of pending approval requests
          content:
            application/json:
              schema:
                type: object
                properties:
                  approvals:
                    type: array
                    items:
                      $ref: '#/components/schemas/Approval'

  /approvals/{id}/decision:
    post:
      summary: Human-in-the-Loop Approval Decision
      description: Submits a manager decision (APPROVE, REJECT, REQUEST_MORE_INFO). On APPROVE, applies transactional timecard adjustments with optimistic concurrency locks.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [APPROVE, REJECT, REQUEST_MORE_INFO]
                decisionComment:
                  type: string
                  description: Required if decision is REJECT
      responses:
        '200':
          description: Decision executed and audit log recorded

  /policies:
    get:
      summary: List Policy Documents
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of indexed company policies
          content:
            application/json:
              schema:
                type: object
                properties:
                  policies:
                    type: array
                    items:
                      $ref: '#/components/schemas/PolicyDocument'
    post:
      summary: Upload & Ingest Policy Document
      description: Accepts policy text, performs automatic section and paragraph chunking, generates SHA256 checksums, and stores chunks in SQLite and Qdrant.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, category, content]
              properties:
                title:
                  type: string
                category:
                  type: string
                  enum: [TIMEKEEPING, OVERTIME, MISSING_PUNCH, LATE_ARRIVAL, SHIFT_SCHEDULING, GENERAL]
                content:
                  type: string
      responses:
        '201':
          description: Policy uploaded and chunked successfully

  /audit:
    get:
      summary: Immutable Audit Log Trail
      security:
        - BearerAuth: []
      parameters:
        - name: entityType
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Audit logs retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  logs:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditLog'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        displayName:
          type: string
        role:
          type: string
          enum: [EMPLOYEE, MANAGER, HR_ADMIN, SYSTEM_ADMIN]

    Employee:
      type: object
      properties:
        id:
          type: string
        employeeCode:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        department:
          type: string
        jobTitle:
          type: string
        managerEmployeeId:
          type: string
          nullable: true

    AttendanceRecord:
      type: object
      properties:
        id:
          type: string
        employeeId:
          type: string
        clockInUtc:
          type: string
          format: date-time
          nullable: true
        clockOutUtc:
          type: string
          format: date-time
          nullable: true
        source:
          type: string
          enum: [BADGE_SWIPE, MOBILE_PUNCH, WEB_PUNCH, SYSTEM_ADJUSTMENT]
        status:
          type: string
          enum: [RECORDED, FLAGGED, RESOLVED]
        version:
          type: integer

    ExceptionCase:
      type: object
      properties:
        id:
          type: string
        employeeId:
          type: string
        exceptionType:
          type: string
        severity:
          type: string
          enum: [LOW, MEDIUM, HIGH]
        status:
          type: string
          enum: [DETECTED, INVESTIGATING, WAITING_FOR_APPROVAL, RESOLVED, REJECTED, CANCELLED]
        facts:
          type: object
        version:
          type: integer

    Investigation:
      type: object
      properties:
        id:
          type: string
        summary:
          type: string
        confidenceScore:
          type: number
        confirmedFacts:
          type: array
          items:
            type: string
        missingInfo:
          type: array
          items:
            type: string

    Recommendation:
      type: object
      properties:
        id:
          type: string
        proposedAction:
          type: string
        rationale:
          type: string
        riskLevel:
          type: string
          enum: [LOW, MEDIUM, HIGH]
        citations:
          type: array
          items:
            type: object
        proposedChanges:
          type: array
          items:
            type: object

    Approval:
      type: object
      properties:
        id:
          type: string
        exceptionId:
          type: string
        recommendationId:
          type: string
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED, EXPIRED]
        requiredRole:
          type: string
        assignedApproverId:
          type: string
          nullable: true
        requestedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time

    PolicyDocument:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        category:
          type: string
        version:
          type: string
        chunkCount:
          type: integer

    AuditLog:
      type: object
      properties:
        id:
          type: string
        actorType:
          type: string
          enum: [USER, SYSTEM, WORKFLOW]
        actorId:
          type: string
        action:
          type: string
        entityType:
          type: string
        entityId:
          type: string
        beforeJson:
          type: string
        afterJson:
          type: string
        reason:
          type: string
        createdAt:
          type: string
          format: date-time
