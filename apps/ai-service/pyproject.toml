[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "attendwise-ai-service"
version = "1.0.0"
description = "AttendWise AI Service with LangGraph and FastAPI"
dependencies = [
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "pydantic==2.10.2",
    "pydantic-settings==2.6.1",
    "qdrant-client==1.12.1",
    "httpx==0.28.1",
    "python-dotenv==1.0.1",
    "langchain==0.3.14",
    "langchain-core>=0.3.29",
    "langgraph==0.2.60",
    "langchain-community==0.3.14",
    "langchain-openai==0.2.14",
    "numpy==1.26.4"
]
